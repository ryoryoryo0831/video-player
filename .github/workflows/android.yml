name: Android APK ビルド

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: 署名鍵を復元
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # 別の鍵で署名した APK を公開すると上書きインストールできなくなるので、公開を止める
            echo "::error::署名鍵（KEYSTORE_BASE64）が設定されていないため公開を中止しました"
            exit 1
          else
            echo "::warning::署名鍵が未設定のため一時的なデバッグ鍵で署名します（確認用のビルド）"
          fi

      - name: テスト
        run: gradle testReleaseUnitTest --no-daemon

      - name: 品質チェック（Android Lint）
        continue-on-error: true
        run: |
          gradle lintRelease --no-daemon
          cat app/build/reports/lint.txt

      - name: APK をビルド
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: APK の名前を変更
        run: |
          ls app/build/outputs/apk/release/
          V="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/Orbit-$V.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/Orbit-$V-32bit.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-apk
          path: Orbit-*.apk

      # 公開は main だけ。作業用ブランチではビルドの確認だけ行う
      - name: リリースとして公開
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Orbit 1.0.${{ github.run_number }}
          body: |
            スマホでこのページを開き、下の **Orbit-1.0.${{ github.run_number }}.apk** をタップしてインストールしてください。
            （`-32bit` 付きは古い機種向けです。普通のAPKが「インストールできない」と出たときだけ使ってください）
          files: Orbit-*.apk
          make_latest: true
