name: Android APK ビルド

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 署名鍵を復元
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::署名鍵が未設定のため一時的なデバッグ鍵で署名します（更新時に再インストールが必要）"
          fi

      - name: APK をビルド
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: APK の名前を変更
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/VideoPlayer-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-apk
          path: VideoPlayer-*.apk

      - name: リリースとして公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ビデオプレイヤー 1.0.${{ github.run_number }}
          body: スマホでこのページを開き、下の .apk ファイルをタップしてインストールしてください。
          files: VideoPlayer-*.apk
          make_latest: true
